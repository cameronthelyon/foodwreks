<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/book.css">
  <script type="application/ld+json">{{JSONLD_RAW}}</script>
  <script type="module" src="/assets/js/book.js"></script>
</head>
<body class="booking" style="--brand: {{ACCENT}}" data-slug="{{SLUG}}">
  <main class="book-shell">
    <header class="book-head" id="head">
      <h1 id="r-name">&nbsp;</h1>
      <p class="muted" id="r-meta"></p>
    </header>
    <section id="app" class="book-card" aria-live="polite">
      <p class="muted">Loading…</p>
    </section>
    <footer class="book-foot">
      Reservations by <a href="/" target="_blank" rel="noopener">{{BRAND}}</a>, booking software restaurants own.
    </footer>
  </main>
</body>
</html>
